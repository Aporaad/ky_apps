## Gradle JVM args
## CRITICAL: -Duser.language=en -Duser.country=US MUST be in jvmargs (not systemProp)
## Without them, Arabic locale causes version numbers like "3.0.22" -> Arabic "٣.٠.٢٢"
## which breaks all Maven artifact resolution (compileGroovy failure)
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED

## JDK path
org.gradle.java.home=C\:/Program Files/Java/jdk-21

## Android
android.useAndroidX=true
android.enableJetifier=false
android.suppressUnsupportedCompileSdk=36

## Gradle performance
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

## Kotlin compiler execution strategy - use in-process to eliminate Kotlin daemon socket timeout on Windows/JDK 21
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
