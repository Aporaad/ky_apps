# بناء IPA لـ iOS بلا توقيع — يُنفَّذ على Codemagic (macOS سحابي، 500 دقيقة مجانية شهرياً)
# Unsigned iOS IPA build for Codemagic (cloud macOS, 500 free minutes per month).
#
# لماذا بلا توقيع؟ لأن التوقيع والتثبيت يجريان محلياً على ويندوز عبر Sideloadly بحساب
# Apple ID مجاني (7 أيام لكل توقيع). النتيجة: لا شهادة ولا كلمة سر Apple تُرفع لهذه
# الخدمة السحابية إطلاقاً. التفاصيل الكاملة في ios_release_guide.md.
#
# Why unsigned? Signing and installation happen locally on Windows through Sideloadly
# with a free Apple ID (7-day profile). Result: no certificate and no Apple password is
# ever uploaded to this cloud service. Full details in ios_release_guide.md.
#
# الاستعمال: اربط مستودع GitHub في Codemagic ثم Start new build ← workflow: ios-unsigned
# Usage: connect the GitHub repo in Codemagic, then Start new build -> ios-unsigned.

workflows:
  ios-unsigned:
    name: iOS unsigned IPA (Sideloadly-ready)
    instance_type: mac_mini_m2
    max_build_duration: 60

    # تنبيه: مخطط Codemagic الرسمي يرفض أي حقل غير معروف داخل clone
    # (خطأ "clone -> extra fields not permitted")، لذلك لا نضع كتلة clone إطلاقاً.
    # النتيجة: المستودع الفرعي kyApp_API يُجلَب تلقائياً عند clone الافتراضي، وهو مستودع
    # عام فلا يُسبب فشلاً، ويزيد زمن الجلب ثواني فقط.
    # NOTE: Codemagic's schema rejects unknown keys inside clone ("clone -> extra fields
    # not permitted"), so the clone block is omitted on purpose. The kyApp_API submodule
    # is therefore fetched by the default clone; it is a public repo, so this only costs
    # a few seconds and cannot fail the build.

    environment:
      # إصدارات مثبّتة صراحةً لمطابقة أدوات التطوير المحلية (Flutter 3.29.3 / Dart 3.7.2).
      # إن رفضت الخدمة توفر Xcode 16.2 فاستبدل القيمة بأحدث إصدار متاح في
      # Codemagic ← Settings، أو ارفع Flutter إلى أحدث stable (ios_release_guide.md §7).
      # Pinned explicitly to match the local toolchain. If Xcode 16.2 is not offered,
      # pick the newest available version, or upgrade Flutter (ios_release_guide.md §7).
      flutter: 3.29.3
      xcode: "16.2"
      cocoapods: default
      vars:
        BUNDLE_ID: com.alkaboudy.app

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.pub-cache

    scripts:
      # خطوة تشخيصية تكلف ثانية واحدة: إن لم يكن Xcode المطلوب مثبتاً على الآلة،
      # تظهر قائمة الإصدارات المتاحة في السجل فوراً بدل انتظار دقائق ثم فشل غامض.
      # One-second diagnostic: if the requested Xcode is missing on the machine, the
      # available versions show up in the log immediately instead of a late vague failure.
      - name: List available Xcode versions (تشخيص)
        script: ls -1 /Applications | grep -i '^xcode' || true

      - name: Encoding gate (بوابة الترميز)
        # سبب وجودها: ملف .gitignore كان بترميز Windows-1256 فهوت أداة Flutter
        # SwiftPackageManagerGitignoreMigration قبل بدء البناء برسالة لا تذكر الترميز،
        # وأضاعت جولة بناء كاملة. هذه الخطوة تُفشل البناء في ثانية برسالة صريحة.
        # Why: a Windows-1256 .gitignore crashed SwiftPackageManagerGitignoreMigration with a
        # message that never mentioned encoding and wasted a full build. Fail fast instead.
        script: |
          set -e
          for f in .gitignore ios/.gitignore android/.gitignore pubspec.yaml; do
            if [ -f "$f" ] && ! iconv -f UTF-8 -t UTF-8 "$f" > /dev/null 2>&1; then
              echo "FAIL: $f is not valid UTF-8 — flutter build ios will crash on it."
              echo "Fix locally: python tools/check_encoding.py --fix"
              exit 1
            fi
          done
          echo "UTF-8 OK: .gitignore · ios/.gitignore · android/.gitignore · pubspec.yaml"

      - name: Get packages (تحميل الحزم)
        script: flutter pub get

      - name: Analyze (بوابة الجودة)
        # الاختبارات الكاملة تُشغَّل محلياً قبل الدفع (بعضها يعتمد على عنوان API على
        # الشبكة المحلية ولا يصلح داخل بيئة سحابية معزولة).
        # The full test suite runs locally before pushing (some tests depend on the LAN
        # API address and cannot pass inside an isolated cloud environment).
        script: flutter analyze

      - name: CocoaPods install
        script: |
          cd ios
          pod install

      - name: Build device app without signing (بناء بلا توقيع)
        script: flutter build ios --release --no-codesign

      - name: Package unsigned IPA (تغليف الملف)
        script: |
          set -e
          VERSION=$(grep -E '^version:' pubspec.yaml | cut -d' ' -f2)
          cd build/ios/iphoneos
          # Payload/*.ipa هو الشكل الوحيد الذي يقبله Sideloadly.
          # Payload/*.ipa is the only layout Sideloadly accepts.
          rm -rf Payload
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          # الخيار -qry يحفظ الروابط الرمزية داخل Frameworks — بدونها يرفض الموقّع الملف.
          # -qry preserves symlinks inside Frameworks — signing fails without it.
          zip -qry "ky-apps-${VERSION}-unsigned.ipa" Payload
          ls -lh "ky-apps-${VERSION}-unsigned.ipa"

      - name: Verify unsigned IPA (التحقق من محتوى الملف)
        # لا نعتمد على "البناء نجح" كدليل على صلاحية الملف: نقرأ Info.plist من داخل الحزمة
        # ونفشل البناء إن غاب معرّف الحزمة أو ATS أو إذن الصور — وهي أعطال لا تظهر إلا
        # على الجهاز بعد التثبيت. يُستخدم plutil (مدمج في macOS، بلا اعتماديات).
        # "Build succeeded" is not proof the bundle is usable: read Info.plist from inside it and
        # fail if the bundle id, ATS, or the photo permission is missing — these only surface on
        # the device after installation. plutil ships with macOS, so no extra dependency.
        script: |
          set -e
          cd build/ios/iphoneos
          APP=Payload/Runner.app
          PLIST="$APP/Info.plist"
          # استخراج متسامح: المفتاح الغائب يُصبح نصاً مميزاً بدل أن يوقف `set -e`
          # عند plutil برسالة أقل وضوحاً. Tolerant extraction so OUR message is the one shown.
          BUNDLE=$(/usr/bin/plutil -extract CFBundleIdentifier raw "$PLIST" 2>/dev/null || echo "missing")
          VERSION=$(/usr/bin/plutil -extract CFBundleShortVersionString raw "$PLIST" 2>/dev/null || echo "?")
          BUILD=$(/usr/bin/plutil -extract CFBundleVersion raw "$PLIST" 2>/dev/null || echo "?")
          NAME=$(/usr/bin/plutil -extract CFBundleDisplayName raw "$PLIST" 2>/dev/null || echo "?")
          ATS=$(/usr/bin/plutil -extract NSAppTransportSecurity.NSAllowsArbitraryLoads raw "$PLIST" 2>/dev/null || echo "missing")
          LOCAL=$(/usr/bin/plutil -extract NSAppTransportSecurity.NSAllowsLocalNetworking raw "$PLIST" 2>/dev/null || echo "missing")
          PHOTO=$(/usr/bin/plutil -extract NSPhotoLibraryUsageDescription raw "$PLIST" 2>/dev/null || echo "")
          echo "bundle=$BUNDLE version=$VERSION build=$BUILD name=$NAME"
          echo "ats=$ATS local=$LOCAL photo_chars=${#PHOTO}"
          test "$BUNDLE" = "com.alkaboudy.app" || { echo "FAIL: bundle id is '$BUNDLE' not com.alkaboudy.app"; exit 1; }
          test "$ATS" = "true" || { echo "FAIL: NSAllowsArbitraryLoads missing — every API call fails on device"; exit 1; }
          test "$LOCAL" = "true" || { echo "FAIL: NSAllowsLocalNetworking missing — LAN API unreachable"; exit 1; }
          test -n "$PHOTO" || { echo "FAIL: NSPhotoLibraryUsageDescription missing — logo picker crashes"; exit 1; }
          test -d "$APP/Frameworks/App.framework" || { echo "FAIL: App.framework missing from bundle"; exit 1; }
          test -d "$APP/Frameworks/Flutter.framework" || { echo "FAIL: Flutter.framework missing from bundle"; exit 1; }
          echo "IPA VERIFIED: $BUNDLE v$VERSION+$BUILD ($NAME)"

    artifacts:
      # ملف التثبيت + رموز التفكيك (لازمة لقراءة أي crash على الجهاز).
      # The installable file plus dSYMs (required to symbolicate any on-device crash).
      - build/ios/iphoneos/*.ipa
      - build/ios/iphoneos/Runner.app.dSYM
      - /tmp/xcodebuild_logs/*.log

    # لا خطوة publishing: التوزيع يدوي عبر Sideloadly من جهاز ويندوز.
    # No publishing step: distribution is manual through Sideloadly on Windows.
